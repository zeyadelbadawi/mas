name: Deploy production

# Production deploys from GitHub Actions with the Vercel CLI and a token of the Vercel account that owns the
# projects. The Git integration blocks merges on the Hobby plan when the commit's GitHub account is linked to
# another Vercel account ("commit author did not have contributing access"); a CLI deploy is made by the token's
# owner. The build runs on Vercel with each project's own settings (root directory, environment variables).
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN               a token created on the owner account (Account Settings → Tokens)
#   VERCEL_ORG_ID              the team ID (Team Settings → General → Team ID)
#   VERCEL_PROJECT_ID_MAS      Project Settings → General → Project ID, for each project
#   VERCEL_PROJECT_ID_COVY
#   VERCEL_PROJECT_ID_AROMA
# A site whose project ID is not set is skipped.

on:
  push:
    branches: [claude/sweet-keller-29pkds]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: mas
            project: VERCEL_PROJECT_ID_MAS
          - site: covy
            project: VERCEL_PROJECT_ID_COVY
          - site: aroma
            project: VERCEL_PROJECT_ID_AROMA
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check the secrets
        id: ready
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Secrets for ${{ matrix.site }} are not set; skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.go == 'true'
        uses: actions/checkout@v4

      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Uploads the repository and builds on Vercel as a production deployment of this project.
      - name: Deploy to production
        if: steps.ready.outputs.go == 'true'
        run: npx --yes vercel@65.7.0 deploy --prod --yes --token="$VERCEL_TOKEN"
