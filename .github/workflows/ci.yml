name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests
        run: pnpm turbo run lint typecheck test

      - name: Asset manifest is up to date
        run: pnpm --filter @mas/tools exec node assets/manifest.mjs --check

      - name: Dependency audit (production, high and above)
        run: pnpm audit --prod --audit-level high

      - name: Build
        run: pnpm turbo run build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke tests (EN/AR, desktop and mobile)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
